packages:
  - "apps/*"
  - "packages/*"

# Remediación de `pnpm audit --audit-level high` (MONOREPO.md Fase 6, ADR 0002).
# Solo copias TRANSITIVAS de tooling de dev (linters, test runner): ninguna llega
# al runtime de apps/web ni de apps/api. La clave es el rango EXACTO que reporta
# el advisory (`vulnerable_versions` de `pnpm audit --json`).
overrides:
  "handlebars@>=3.0.0 <=4.7.9": "^4.7.10" # packages/config > eslint-plugin-boundaries > @boundaries/elements
  "tinypool@<2.1.2": "^2.1.2" # apps/web > vitest
