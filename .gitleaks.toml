title = "gitleaks — Scout"

# Reglas por defecto de gitleaks (patrones de proveedores conocidos) + la allowlist de abajo.
[extend]
useDefault = true

# Cada entrada revisada a mano contra `gitleaks detect` sobre el historial completo del
# monorepo (299 commits, incluidos los importados de scout-back y scout-front-react) con
# `git show` del hallazgo. Todas son falsos positivos, nunca secretos reales. Agregar una
# entrada nueva exige el mismo chequeo.
[[allowlists]]
description = "Header JWT de ejemplo sin payload ni firma (falso positivo revisado)."
# Header JWT estándar ({"alg":"HS256","typ":"JWT"}) seguido de "..." en los ejemplos de
# respuesta de apps/api/docs/AUTH_FRONTEND_GUIDE.md: no hay payload ni firma.
regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''']

[[allowlists]]
description = "Token de ejemplo del badge del boilerplate de Nest (falso positivo revisado)."
# Solo en apps/api/README.md (badge de CircleCI de `nest new`, mismo caso que mi-tienda).
# `condition = AND`: el valor y el archivo tienen que coincidir los dos.
condition = "AND"
paths = ['''^apps/api/README\.md$''']
regexes = ['''^abc123def456$''']
